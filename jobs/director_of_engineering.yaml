# Job spec for the screener. Everything the model judges comes from here;
# weights and thresholds are applied in code, so editing them re-ranks from
# cached answers without new API calls.

title: Director of Engineering
target_level: Executive Director
summary: >
  Lead the backend engineering organization behind our payments platform:
  Python services with REST/gRPC APIs on PostgreSQL, event pipelines on
  Kafka, deployed to Kubernetes on AWS. The Director leads several backend
  teams through engineering managers and tech leads, owns delivery,
  reliability, and hiring, sets technical direction and standards across
  teams, and represents engineering to product and business leadership.

# Each must-have becomes one Noul: "does the resume show evidence of this?"
must_haves:
  - id: python_professional
    requirement: Has used Python in a paid engineering role, as an engineer or a hands-on technical leader (not only coursework or hobby projects)
  - id: backend_services
    requirement: Has built, or led teams that built and ran, server-side services or APIs in production
  - id: people_management
    requirement: Has managed engineers, or managers of engineers, in a paid role, with responsibility for their hiring, performance, or growth (not only mentoring or tech-lead duties)

# Each skill becomes one Score. Levels run from least to most and must
# each describe a concrete situation on their own.
skills:
  - id: python_depth
    weight: 0.15
    question: How deep is the candidate's grounding in Python engineering, including setting Python practices for others, based on `resume`?
    levels:
      - No Python experience mentioned
      - Python mentioned, but no detail about what was built or led
      - Built or led Python projects, with a few specifics
      - Python was the primary language of the candidate's own engineering work or of the teams they led, across multiple roles
      - Set Python engineering standards across several teams, such as coding practices, tooling, frameworks, or architecture reviews

  - id: distributed_systems
    weight: 0.25
    question: How much accountability has the candidate had for the architecture, reliability, and scale of distributed backend systems, based on `resume`?
    levels:
      - No backend systems work mentioned
      - Worked on or led a single service without scale or reliability concerns
      - Led the design or delivery of a multi-service system, with some attention to reliability
      - Accountable for a team's platform handling significant traffic or data volume, including incidents and reliability targets
      - Accountable across several teams for a high-scale platform's architecture and reliability, such as SLOs, incident management, and capacity planning

  - id: data_stores
    weight: 0.10
    question: How much responsibility has the candidate had for relational databases such as PostgreSQL in production, from hands-on work to data strategy across teams, based on `resume`?
    levels:
      - No database experience mentioned
      - Used or oversaw a database with no further detail
      - Designed schemas, or led teams that owned production databases
      - Owned data strategy across teams, such as database choices, scaling, or large migrations

  - id: technical_leadership
    weight: 0.40
    question: How much engineering leadership has the candidate shown, from mentoring and leading projects to managing managers and shaping an engineering organization, based on `resume`?
    levels:
      - No leadership or management mentioned
      - Mentored engineers or led a project, without managing people
      - Managed a single team of engineers, including hiring or performance reviews
      - Managed several teams or managers of engineers, owning delivery and technical direction across them
      - Led an engineering organization through managers, owning its structure, hiring plans, budget, or strategy, and partnering with executive leadership

  - id: domain_relevance
    weight: 0.10
    question: How relevant is the candidate's industry experience in `resume` to `job.summary`?
    levels:
      - Unrelated industry with no transferable domain exposure
      - Adjacent domain, such as general e-commerce or B2B SaaS
      - Fintech, payments, or other regulated financial systems

thresholds:
  must_have_pass: 0.80    # at or above: requirement met
  must_have_fail: 0.20    # below: requirement not shown; between: human review
  min_confidence: 0.45    # a Score below this on a weight >= 0.2 skill goes to review
