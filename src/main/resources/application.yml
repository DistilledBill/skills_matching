spring:
  application:
    name: resume-screening
  config:
    # Local secrets (git-ignored); an exported environment variable still wins.
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

typesafe:
  api-key: ${TYPESAFE_API_KEY:}
  base-url: https://api.typesafe.ai
  model: jev-latest
  max-concurrent: 8       # in-flight TypeSafe requests across the whole app
  max-attempts: 4         # retries 429/529/5xx and connection errors
  initial-backoff: 500ms  # doubled after each retry
  timeout: 60s
  cache-dir: .cache

# Claude, used only to suggest questions, levels and requirements in the spec editor.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: https://api.anthropic.com
  model: claude-sonnet-5
  max-tokens: 2000
  max-attempts: 3         # retries 429/529/5xx and connection errors
  initial-backoff: 1s     # doubled after each retry
  timeout: 60s

screening:
  jobs-dir: jobs
  resumes-dir: resumes    # /folder?path= is resolved inside this directory
